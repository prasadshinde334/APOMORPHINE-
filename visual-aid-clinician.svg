<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900">
<rect width="1400" height="1900" fill="#f5f8fb"/><rect x="0" y="0" width="1400" height="310" fill="#071b35"/>
<text x="90" y="88" fill="#9eb5c9" font-family="Arial" font-size="22" letter-spacing="6">CLINICIAN VISUAL AID · MOTOR FLUCTUATIONS</text>
<text x="90" y="175" fill="white" font-family="Georgia" font-size="66" font-weight="bold">When OFF interrupts the moment.</text>
<text x="90" y="232" fill="#d6e2ec" font-family="Arial" font-size="27">Identify the OFF episode → assess the patient → discuss an appropriate rescue strategy.</text>
<rect x="90" y="355" width="1220" height="220" rx="8" fill="white" stroke="#d9e3eb"/>
<text x="130" y="410" fill="#9e1239" font-family="Arial" font-size="18" font-weight="bold" letter-spacing="4">THE PATIENT SIGNAL</text>
<text x="130" y="468" fill="#071b35" font-family="Georgia" font-size="34" font-weight="bold">“My medicine is working… until suddenly it isn’t.”</text>
<text x="130" y="520" fill="#607089" font-family="Arial" font-size="21">Troublesome OFF may present as sudden slowness, difficulty walking, impaired function or an unpredictable interruption.</text>

<text x="90" y="670" fill="#071b35" font-family="Georgia" font-size="43" font-weight="bold">A simple clinical conversation</text>
<g font-family="Arial">
<rect x="90" y="735" width="365" height="360" rx="8" fill="#fff" stroke="#d7e1e9"/><circle cx="160" cy="805" r="30" fill="#9e1239"/><text x="151" y="813" fill="white" font-size="22" font-weight="bold">1</text><text x="215" y="814" fill="#071b35" font-size="27" font-weight="bold">ASK</text><text x="130" y="875" fill="#607089" font-size="21">How often does your</text><text x="130" y="907" fill="#607089" font-size="21">patient experience</text><text x="130" y="939" fill="#071b35" font-size="24" font-weight="bold">troublesome OFF?</text><line x1="130" y1="975" x2="415" y2="975" stroke="#e1e8ee"/><text x="130" y="1020" fill="#7a8b9b" font-size="17">Predictable · delayed ON ·</text><text x="130" y="1046" fill="#7a8b9b" font-size="17">unpredictable interruption</text>
<rect x="517" y="735" width="365" height="360" rx="8" fill="#fff" stroke="#d7e1e9"/><circle cx="587" cy="805" r="30" fill="#1673a7"/><text x="578" y="813" fill="white" font-size="22" font-weight="bold">2</text><text x="642" y="814" fill="#071b35" font-size="27" font-weight="bold">ASSESS</text><text x="557" y="875" fill="#607089" font-size="21">Characterize the OFF</text><text x="557" y="907" fill="#607089" font-size="21">pattern and current</text><text x="557" y="939" fill="#071b35" font-size="24" font-weight="bold">treatment response.</text><line x1="557" y1="975" x2="842" y2="975" stroke="#e1e8ee"/><text x="557" y="1020" fill="#7a8b9b" font-size="17">Review regimen · timing ·</text><text x="557" y="1046" fill="#7a8b9b" font-size="17">functional impact · suitability</text>
<rect x="944" y="735" width="365" height="360" rx="8" fill="#fff" stroke="#d7e1e9"/><circle cx="1014" cy="805" r="30" fill="#d4ad63"/><text x="1005" y="813" fill="#071b35" font-size="22" font-weight="bold">3</text><text x="1069" y="814" fill="#071b35" font-size="27" font-weight="bold">DISCUSS</text><text x="984" y="875" fill="#607089" font-size="21">For an appropriate</text><text x="984" y="907" fill="#607089" font-size="21">patient, consider a</text><text x="984" y="939" fill="#071b35" font-size="24" font-weight="bold">rapid SC rescue option.</text><line x1="984" y1="975" x2="1269" y2="975" stroke="#e1e8ee"/><text x="984" y="1020" fill="#7a8b9b" font-size="17">Use approved PI, training</text><text x="984" y="1046" fill="#7a8b9b" font-size="17">and patient-selection criteria</text>
</g>
<rect x="90" y="1160" width="1220" height="330" rx="8" fill="#071b35"/><text x="130" y="1220" fill="#8fb1c7" font-family="Arial" font-size="17" letter-spacing="4">WHY APOMORPHINE?</text>
<g font-family="Arial"><text x="130" y="1295" fill="white" font-size="29" font-weight="bold">SUBCUTANEOUS</text><text x="130" y="1332" fill="#b9c9d7" font-size="19">Direct systemic delivery</text><text x="130" y="1362" fill="#b9c9d7" font-size="19">without GI absorption dependence</text><text x="500" y="1295" fill="white" font-size="29" font-weight="bold">DIRECT AGONISM</text><text x="500" y="1332" fill="#b9c9d7" font-size="19">Stimulates dopamine receptors</text><text x="500" y="1362" fill="#b9c9d7" font-size="19">without conversion to dopamine</text><text x="900" y="1295" fill="#ef6a82" font-size="29" font-weight="bold">CLINICAL AIM</text><text x="900" y="1332" fill="#b9c9d7" font-size="19">Reverse a troublesome</text><text x="900" y="1362" fill="#b9c9d7" font-size="19">OFF episode in an appropriate patient</text></g>
<path d="M420 1315h60M820 1315h60" stroke="#e15a74" stroke-width="3"/>
<rect x="90" y="1550" width="1220" height="205" rx="8" fill="#fff" stroke="#d7e1e9"/><text x="130" y="1605" fill="#9e1239" font-family="Arial" font-size="16" font-weight="bold" letter-spacing="3">EVIDENCE SNAPSHOT</text><text x="130" y="1660" fill="#071b35" font-family="Georgia" font-size="30" font-weight="bold">Dewey et al. · randomized, double-blind, placebo-controlled</text><text x="130" y="1710" fill="#607089" font-family="Arial" font-size="20">29 patients with advanced PD and ≥2 h OFF despite aggressive oral therapy; SC apomorphine reduced UPDRS motor score by 23.9 points at 20 min vs 0.1 with placebo.</text><text x="130" y="1745" fill="#9e1239" font-family="Arial" font-size="18" font-weight="bold">PMID 11559309 · Verify current local PI before promotional use.</text>
</svg>
