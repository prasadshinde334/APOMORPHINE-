<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<rect width="1600" height="1200" fill="#edf3f7"/><rect x="0" y="0" width="1600" height="190" fill="#071b35"/>
<text x="85" y="62" fill="#9eb5c9" font-family="Arial" font-size="18" letter-spacing="5">CLINICAL EVIDENCE · LBL</text><text x="85" y="132" fill="white" font-family="Georgia" font-size="55" font-weight="bold">Breaking the OFF cycle</text>
<rect x="85" y="235" width="1430" height="175" rx="6" fill="white"/><text x="125" y="285" fill="#9e1239" font-family="Arial" font-size="15" font-weight="bold" letter-spacing="3">CLINICAL QUESTION</text><text x="125" y="350" fill="#071b35" font-family="Georgia" font-size="34" font-weight="bold">Can intermittent subcutaneous apomorphine reverse an established OFF episode?</text>
<rect x="85" y="455" width="690" height="430" rx="6" fill="#071b35"/><text x="125" y="510" fill="#8fb1c7" font-family="Arial" font-size="14" letter-spacing="3">STUDY DESIGN</text><text x="125" y="570" fill="white" font-family="Arial" font-size="25" font-weight="bold">Randomized · double-blind · placebo-controlled</text><text x="125" y="625" fill="#b9c9d7" font-family="Arial" font-size="20">29 patients with advanced Parkinson's disease</text><text x="125" y="660" fill="#b9c9d7" font-family="Arial" font-size="20">≥2 hours OFF despite aggressive oral therapy</text><text x="125" y="695" fill="#b9c9d7" font-family="Arial" font-size="20">Apomorphine 2–10 mg SC vs placebo</text><line x1="125" y1="735" x2="730" y2="735" stroke="#29445d"/><text x="125" y="790" fill="#ef6a82" font-family="Georgia" font-size="43" font-weight="bold">20 min</text><text x="280" y="790" fill="#cbd8e2" font-family="Arial" font-size="18">primary inpatient motor assessment</text>
<rect x="815" y="455" width="700" height="205" rx="6" fill="white"/><text x="855" y="510" fill="#9e1239" font-family="Arial" font-size="14" letter-spacing="3">RESULT 01 · MOTOR RESPONSE</text><text x="855" y="590" fill="#071b35" font-family="Georgia" font-size="65" font-weight="bold">−23.9</text><text x="1110" y="560" fill="#607089" font-family="Arial" font-size="19">mean UPDRS motor score</text><text x="1110" y="590" fill="#607089" font-family="Arial" font-size="19">change at 20 min</text><text x="855" y="630" fill="#7c8b9b" font-family="Arial" font-size="14">vs −0.1 with placebo · P&lt;0.001</text>
<rect x="815" y="680" width="700" height="205" rx="6" fill="white"/><text x="855" y="735" fill="#9e1239" font-family="Arial" font-size="14" letter-spacing="3">RESULT 02 · OFF EVENT ABORTION</text><text x="855" y="815" fill="#071b35" font-family="Georgia" font-size="65" font-weight="bold">95%</text><text x="1070" y="785" fill="#607089" font-family="Arial" font-size="19">outpatient injections</text><text x="1070" y="815" fill="#607089" font-family="Arial" font-size="19">successfully aborted OFF</text><text x="855" y="855" fill="#7c8b9b" font-family="Arial" font-size="14">vs 23% with placebo · P&lt;0.001</text>
<rect x="85" y="930" width="1430" height="165" rx="6" fill="#fff" stroke="#d5e0e8"/><text x="125" y="980" fill="#071b35" font-family="Georgia" font-size="25" font-weight="bold">Clinical relevance</text><text x="125" y="1023" fill="#607089" font-family="Arial" font-size="18">The study supports intermittent SC apomorphine as a rescue strategy for OFF-state events despite optimized oral therapy.</text><text x="125" y="1060" fill="#9e1239" font-family="Arial" font-size="15" font-weight="bold">Dewey RB Jr et al. Arch Neurol. 2001;58:1385–1392. PMID 11559309.</text>
</svg>
